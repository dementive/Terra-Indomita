 zhuzibaijia_rujia:0 "Ruism"
 zhuzibaijia_rujia_desc:0 "Ruism, or Confucianism, is a school of thought that believes in the doctrine of Confucius, the core of which is benevolence. Mencius, a representative figure of Confucianism in the early Qin Dynasty, developed the doctrine of Confucius and advocated benevolent government. The Confucian doctrine founded by Kongzi formed a complete ideological system based on the summary, generalization and inheritance of the traditional culture of the Xia, Shang and Zhou dynasties, which respected relatives."
 zhuzibaijia_fajia:0 "Legalism"
 zhuzibaijia_fajia_desc:0 "Legalism is a school of thought in the Spring and Autumn and Warring States period of China that focuses on the rule of law. This school of thought rejected the hierarchical system inherited from the hereditary nobility and believed that 'if a sage can strengthen a country, he should not follow his own rules, and if he can benefit the people, he should not follow his own rites.' In their political practice, they rewarded farming and warfare, emphasized agriculture and suppressed commerce, destroyed poetry and books, completely broke with traditional culture, and advocated the rule of law. The doctrine of Legalism was a purely utilitarian system of thought, and its core content was mainly directed at how the monarch could strengthen his rule. In the Warring States period, when 'don't give courtesy but war, abandon benevolence and righteousness but use deceit, if only to get strong', this kind of thinking of Legalism was indeed quite practical in the struggle."
 zhuzibaijia_mojia:0 "Mohism"
 zhuzibaijia_mojia_desc:0 "Mozi's school was one of the major philosophical schools in China during the pre-Qin period, with a strict discipline and a leader known as ‘Kuizi’. Members of Mozi's family were required to implement his ideas as officials in various countries, and to follow the orders of the Kuizi. Mozi studied Confucianism in his early years, but later abandoned it to create his own school. Therefore, although most of Mozi's ideas were opposed to Confucianism, they were also influenced by Confucianism. The ten major ideas of Mozi are ‘concurrent love’, ‘non-attack’, ‘virtuousness’, ‘common sense’, ‘heavenly ambition’, and ‘the will of the gods’. ‘Heaven's Will’, ‘Ming Ghost’, ‘Non-life’, ‘Non-Love’, ‘ Save burial’ and ‘Save use’."
 zhuzibaijia_daojia:0 "Daoism"
 zhuzibaijia_daojia_desc:0 "Daoism, one of the Hundred Schools of Thought. During the Spring and Autumn Period and the Warring States Period, Laozi gathered the wisdom of the ancient sages and formed a complete and systematic theory of Daoism, marking the formal formation of Daoist thought. Daoism, with 'Dao' as its core, believes in the inaction of the Great Way, advocates the natural method of Dao, and proposes such political, economic, governance and military strategies as the creation of the Law of Dao, the use of female to guard the male, and the parallelism of rigidity and flexibility. It is one of the most important philosophical schools among the 'Hundred Schools of Thought' and is found in all areas of Chinese culture. It believes that 'Dao follows nature', that 'Dao' follows all things, respects all differences in the world, and assists in the full development of all differences. Therefore, there is no unified form of Dao, nor is there a unified way to approach Dao, which delegates power to human beings and allows them to become their own masters."
 enter_zhuzibaijia_chinese:0 "Accept the Hundred Schools of Thought"
 enter_zhuzibaijia_chinese_desc:0 "It is in our best interest to heed the words of our scholars and sages."
 enter_zhuzibaijia_baipu:0 "Accept the Huaxia Philosophies"
 enter_zhuzibaijia_baipu_desc:0 "Word spreads of the distant Huaxia peoples to the north, and their civilized ways. Let us follow in their footsteps."
 enter_zhuzibaijia_baiyue:0 "Accept the Huaxia Philosophies"
 enter_zhuzibaijia_baiyue_desc:0 "Word spreads of the Huaxia peoples to the north, and their civilized ways. Let us follow in their footsteps."
 enter_zhuzibaijia_rongdi:0 "Accept the Huaxia Philosophies"
 enter_zhuzibaijia_rongdi_desc:0 "Word spreads of the Huaxia peoples to the east, and their civilized ways. Let us follow in their footsteps."
 enter_zhuzibaijia_yi:0 "Accept the Huaxia Philosophies"
 enter_zhuzibaijia_yi_desc:0 "Word spreads of the Huaxia peoples to the north, and their civilized ways. Let us follow in their footsteps."
 abolish_shangyang_low:0 "Abolish Shang Yang's Law"
 abolish_shangyang_low_desc:0 "Shang Yang's law has caused many complaints from the masses. Now that all under heaven has been pacified, it's time to abolish Shang Yang's law!"
 burn_books_buried_Confucian_scholar:0 "Burn the Books, Bury the Scholars"
 burn_books_buried_Confucian_scholar_desc:0 "The Confucian scholars openly challenge the rulings of His Majesty, and speak against him with impunity! Let us forevermore banish and bury the relics of the old dynasty!"
 che_tonggui_shu_tongwen:0 "Standardize the Measures and Scripts"
 che_tonggui_shu_tongwen_desc:0 "Before unification, every region and state had their own dialect, script, and measurements. Now that we are one Huaxia empire, let us find a new standard to promulgate across the land!"
 yuminxiuxi:0 "Recovery of the Nation"
 yuminxiuxi_desc:0 "After decades of division and conflict, the land and people are weary and poor. Let us cut taxes and recruit less, so the land may be fertile, and our subjects healthy and productive."
 reenabling_shangyang_low:0 "Restore Shang Yang's Law"
 reenabling_shangyang_low_desc:0 "Shang Yang's teachings are integral to the realm's continued prosperity. Let us heed his words and enact his laws."
 aos_bachaoxiuxian:0 "Practice Immortality"
 aos_bachaoxiuxian_desc:0 "Why should you go to court anyway? It's full of spineless advisors stuck in the rat race of government. Practice immortality instead!"
 abolish_bachaoxiuxian:0 "Attend court and manage government"
 abolish_bachaoxiuxian_desc:0 "Leaving the country's affairs unattended is the death of the country! Do your job!"
 aos_chenihougong:0 "Indulge in Alcohol and Sex"
 aos_chenihougong_desc:0 "Wine! Women! What more can you ask for?"
 abolish_chennihougong:0 "No More Alcohol and Sex"
 abolish_chennihougong_desc:0 "Get a hold of yourself! You are the ruler of this nation! Do your job!"
 aos_jubanguoyan:0 "Host a State Dinner"
 aos_jubanguoyan_desc:0 "Host a big feast, and invite everyone!"
 aos_jianlixiyuduhu:0 "Establish the Occidental Protectorate"
 aos_jianlixiyuduhu_desc:0 "For the stability of the western regions, we will create a protectorate, and grant it limited autonomy."
 ce_chaoyi:0 "Court Meeting"
 ce_chaoyi_desc:0 "Call the ministers of your court to discuss the matters of the realm."
 wac_policy_discussion:0 "Court Meeting"
 wac_policy_discussion_desc:0 "Call the ministers of your court to discuss the matters of the realm."
 restitution_rujia_jinjian:0 "Restore Confucianism"
 restitution_rujia_jinjian_desc:0 "At one time we wrongly treated Confucians with the atrocity of burning books and committing a grave sin. Confucians are good-hearted and serve the country and the people, and their presence in our court will make our country better governed. It is time to issue an edict to restore the status of Confucians in our country."
 #tk
 aos_create_empire:0 "Imperial Ambition"
 aos_create_empire_desc:0 "[COUNTRY.GetRuler.GetName], resplendent in the glory of conquest, has eclipsed all other petty Kingdoms; a new title is needed for the ruler of the [COUNTRY.GetAdjective] Empire."
 aos_deify_emperor:0 "Divine Sanction"
 aos_deify_emperor_desc:0 "Few are in denial that [COUNTRY.GetRuler.GetName] is blessed. It follows, therefore, that such divine heritage can only be the property of a divine being."
 #acb
 integrate_north_youzhou:0 "Integrate Northern You"
 integrate_north_youzhou_desc:0 "The infrastructure of northern Youzhou has been quite complete, and there is no longer any difference between the rest of our territory, the previous discussion on the existence of the system in the region can be rested."
 integrate_north_youzhou:0 "Integrate Zhuya"
 integrate_north_youzhou_desc:0 "The infrastructure of Zhuya has been quite complete, and there is no longer any difference between it and other regions of our country, so the previous discussions on the existence or abolition of the supervisory system in the region can be put to rest."
 capital_at_wangcheng:0 "Move Capital to Chengzhou"
 chu_move_capital_to_shouchun:0 "Move the capital to Shouchun"
 chu_move_capital_to_shouchun_desc:0 "The Ying capital in Jing no longer belongs to us, but there is still a place in Huainan that is suitable as our capital - Shouchun."
 nomadic_empire_decision:0 "Nomadic Empire"
 nomadic_empire_decision_desc:0 "Although the vast majority of migrating tribes are hunting and gathering-based tribes, but now a new way of production is gradually growing in the grasslands, these nomadic tribes that began in the grasslands are united, they will be able to become a powerful force."